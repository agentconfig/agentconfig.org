name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# Minimal permissions for security - only read access to repository contents
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Prevent malicious PRs from wasting CI minutes with hung processes
    timeout-minutes: 15
    steps:
      # SHA-pinned to prevent tag hijacking attacks
      # Using v7 (latest stable) for improved credential handling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Official Bun setup action - verified by GitHub
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.x

      # Cache Bun dependencies to speed up CI
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: site
        # frozen-lockfile prevents dependency tampering during CI
        run: bun install --frozen-lockfile

      # Cache Playwright browsers to speed up CI
      # Key based on package.json Playwright version for reliable cache invalidation
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package.json') }}

      - name: Install Playwright browsers
        working-directory: site
        # Only install if cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # Install system dependencies for Playwright (needed even with cached browsers)
      - name: Install Playwright system dependencies
        working-directory: site
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run linting
        working-directory: site
        run: bun run lint

      - name: Run type checking
        working-directory: site
        run: bun run typecheck

      - name: Run tests
        working-directory: site
        run: bun run test

      - name: Build
        working-directory: site
        run: bun run build
